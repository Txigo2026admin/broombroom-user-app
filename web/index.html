<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="txigo_user_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>broomboomcabs_user_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts & Material Icons: Preload fonts for seamless web typography and icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round|Material+Icons+Outlined" rel="stylesheet">
</head>
<body>
  <!-- Cashfree Checkout SDK v3 -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script>
    window.cashfreeCheckout = function(paymentSessionId, env) {
      return new Promise(function(resolve) {
        try {
          var mode = (env === 'production') ? 'production' : 'sandbox';
          var cashfree = Cashfree({ mode: mode });
          cashfree.checkout({
            paymentSessionId: paymentSessionId,
            redirectTarget: "_modal"
          }).then(function(result) {
            console.log("[Cashfree JS] Checkout resolved:", result);
            resolve(JSON.stringify(result || {}));
          }).catch(function(err) {
            console.error("[Cashfree JS] Checkout error:", err);
            resolve(JSON.stringify({ error: err ? String(err) : "Unknown error" }));
          });
        } catch (e) {
          console.error("[Cashfree JS] Exception:", e);
          resolve(JSON.stringify({ error: e ? String(e) : "SDK exception" }));
        }
      });
    };

    window.clearUrlQueryParams = function() {
      try {
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } catch (e) {
        console.warn("Could not clear query params:", e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
